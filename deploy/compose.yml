# deploy-main's Ansible installs this file from the local checkout as /srv/apps/shiny-base/compose.yml (root-owned).
# CI cannot change it: it only sends SHINY_IMAGE as ghcr.io/ma-riviere/shiny-base@sha256:<digest>.
# The platform provides the env files, networks and data folders. The Dockerfile defines the healthcheck.
name: shiny-base

services:
  shiny:
    image: ${SHINY_IMAGE:-ghcr.io/ma-riviere/shiny-base:local}
    restart: unless-stopped
    init: true
    # Allow workers and bookmark-on-disconnect handlers to finish before a forced stop.
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    # Limit the whole container, including workers, to leave resources for other apps.
    cpus: 2
    mem_limit: 4g
    # db.env: DB credentials generated by the platform.
    # app.env: app settings/secrets copied by Ansible from the gitignored master in this repo.
    env_file:
      - db.env
      - app.env
    environment:
      # Main mirai pool in global.R. Chat adds one separate worker when enabled.
      MIRAI_WORKERS: "2"
    # No published ports: Traefik routes (deploy/traefik.yml) reach port 3838 through the edge alias.
    networks:
      edge:
        aliases: [shiny-base]
      postgres: {}
      # Dataset assistant: http://llm:8080/v1, reached directly without Traefik or API authentication.
      llm: {}
    volumes:
      # Server folders survive container replacement and are backed up by the platform (restic).
      # Create them with owner uid 997 (shiny) first; Docker would otherwise create root-owned folders.
      - ./data/bookmarks:/srv/shiny-server/shiny_bookmarks
      - ./data/logs:/var/log/shiny-server
      - ./data/shinylogs:/srv/shiny-server/shinylogs

# Existing platform networks, shared with Traefik, Postgres and the model service.
networks:
  edge:
    external: true
    name: edge
  postgres:
    external: true
    name: postgres
  llm:
    external: true
    name: llm
