name: CI/CD Pipeline

# Build, test, push to GHCR, then deploy through the deploy-server contract
# (push-compose + deploy over the forced-command SSH key; the server
# health-gates the rollout with `docker compose up --wait`).
# Rollback = dispatch with a previous commit SHA as image_tag: build is
# skipped and that exact image is redeployed.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # Empty image_tag rebuilds and deploys HEAD (e.g. after a base-image
    # refresh); a previous commit SHA rolls back without rebuilding.
    workflow_dispatch:
        inputs:
            image_tag:
                description: "Existing image tag to deploy (leave empty to build from the current commit)"
                required: false
                default: ""

permissions:
    contents: read

jobs:
    format-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Install Air
              uses: posit-dev/setup-air@cf390573ff4fe0f198f35df3a642b1409328d859 # v1.0.1
            - name: Check R code formatting and syntax
              run: air format . --check

    check-r-changes:
        runs-on: ubuntu-latest
        outputs:
            r_changed: ${{ steps.check.outputs.r_changed }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
            - name: Check for app changes
              id: check
              run: |
                  if [ "${{ github.event_name }}" == "pull_request" ]; then
                    CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
                  else
                    # Diff the full push range, not just the last commit
                    BEFORE="${{ github.event.before }}"
                    if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
                      BEFORE="HEAD~1"
                    fi
                    CHANGED=$(git diff --name-only "$BEFORE" HEAD)
                  fi
                  echo "Changed files:"
                  echo "$CHANGED"
                  if echo "$CHANGED" | grep -qE '\.R$|renv\.lock$|^Dockerfile|^deploy/|^\.Rprofile$|^\.dockerignore$|^packages-.*\.txt$|^(www|data|database|tests|r-utils)/|^r-utils$|^\.github/workflows/'; then
                    echo "r_changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "r_changed=false" >> $GITHUB_OUTPUT
                  fi

    tests:
        runs-on: ubuntu-latest
        needs: check-r-changes
        if: github.event_name != 'workflow_dispatch' && needs.check-r-changes.outputs.r_changed == 'true'
        permissions:
            contents: read
            checks: write
            pull-requests: write
        container:
            image: ghcr.io/ma-riviere/docker-shiny:4.6-test
            options: --user root
        env:
            AUTH0_DISABLE: "true"
            DEV_ROLES: "admin"
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  submodules: recursive
                  token: ${{ secrets.CICD_GITHUB_PAT }}

            - name: Detect test suites
              id: detect-tests
              run: |
                  if [ -d "tests/testthat" ]; then
                    echo "has_shinytest2=true" >> $GITHUB_OUTPUT
                  else
                    echo "has_shinytest2=false" >> $GITHUB_OUTPUT
                  fi
                  if [ -d "tests/e2e" ]; then
                    echo "has_e2e=true" >> $GITHUB_OUTPUT
                  else
                    echo "has_e2e=false" >> $GITHUB_OUTPUT
                  fi

            # ---- shinytest2 ----
            # Exact dev library: clean = TRUE removes pre-warmed packages not in the
            # lockfile so tests cannot rely on undeclared dependencies
            # (no renv activation in containers: IN_CONTAINER is set by the test image)
            - name: Install R test packages
              if: steps.detect-tests.outputs.has_shinytest2 == 'true'
              env:
                  GITHUB_PAT: ${{ secrets.CICD_GITHUB_PAT }}
              run: Rscript -e '.libPaths(c("/opt/renv-bootstrap", .libPaths())); renv::restore(lockfile = "renv/profiles/dev-4.6/renv.lock", library = Sys.getenv("R_LIBS_SITE"), clean = TRUE, prompt = FALSE)'

            - name: Run shinytest2 tests
              if: steps.detect-tests.outputs.has_shinytest2 == 'true'
              run: |
                  echo "SHINYTEST2_APP_DRIVER_TEST_ON_CRAN=1" >> .Renviron
                  R -e 'shinytest2::test_app(reporter = testthat::JunitReporter$new(file = "junit_shinytest2.xml"))'

            # ---- Playwright e2e ----
            - name: Install Node.js
              if: steps.detect-tests.outputs.has_e2e == 'true'
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"

            - name: Install Playwright dependencies
              if: steps.detect-tests.outputs.has_e2e == 'true'
              working-directory: tests/e2e
              run: |
                  npm ci
                  npx playwright install chromium --with-deps

            - name: Start Shiny app
              if: steps.detect-tests.outputs.has_e2e == 'true'
              run: |
                  R -e "shiny::runApp(port = 9090, launch.browser = FALSE)" &
                  # Wait for app to be ready (max 60s)
                  for i in {1..60}; do
                    if curl -s http://localhost:9090 > /dev/null 2>&1; then
                      echo "App ready on port 9090"
                      break
                    fi
                    echo "Waiting for app... ($i/60)"
                    sleep 1
                  done

            - name: Run Playwright e2e tests
              if: steps.detect-tests.outputs.has_e2e == 'true'
              working-directory: tests/e2e
              env:
                  CI: true
              run: npx playwright test --reporter=junit

            # ---- Results ----
            - name: Publish test results
              if: always()
              uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
              with:
                  report_paths: |
                      junit_shinytest2.xml
                      tests/e2e/results.xml
                  check_name: "Test Results"
                  include_passed: true

    build:
        # Skipped on rollback dispatches: the requested tag already exists on GHCR.
        if: |
            !cancelled() &&
            github.ref == 'refs/heads/main' &&
            (
              (github.event_name == 'workflow_dispatch' && inputs.image_tag == '') ||
              (github.event_name == 'push' && needs.format-check.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped'))
            )
        needs: [format-check, tests]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  submodules: recursive
                  token: ${{ secrets.CICD_GITHUB_PAT }}
            - name: Log in to GHCR
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push
              env:
                  GITHUB_PAT: ${{ secrets.CICD_GITHUB_PAT }}
              run: |
                  docker build \
                    --pull \
                    --secret id=github_pat,env=GITHUB_PAT \
                    -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
                  docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

    deploy:
        # Run after a successful build, or without one on rollback dispatches.
        if: |
            !cancelled() &&
            github.ref == 'refs/heads/main' &&
            github.event_name != 'pull_request' &&
            (
              needs.build.result == 'success' ||
              (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')
            )
        needs: [build]
        runs-on: ubuntu-latest
        concurrency:
            group: deploy-shiny-base-prod
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            # DEPLOY_KNOWN_HOSTS carries the host keys pinned on the trusted dev
            # machine (deploy-server ansible/known_hosts). Never replace this with
            # ssh-keyscan at deploy time: that trusts whoever answers on the network.
            - name: Configure SSH
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Push compose file
              env:
                  INPUT_TAG: ${{ inputs.image_tag }}
              run: |
                  sed "s|\${IMAGE_TAG:-local}|${INPUT_TAG:-${GITHUB_SHA}}|g" deploy/compose.yml \
                    | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p "${{ secrets.DEPLOY_PORT }}" \
                      "deploy@${{ secrets.DEPLOY_HOST }}" push-compose

            - name: Deploy app
              run: |
                  ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p "${{ secrets.DEPLOY_PORT }}" \
                    "deploy@${{ secrets.DEPLOY_HOST }}" deploy
