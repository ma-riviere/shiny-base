name: CI/CD Pipeline

# PRs: check formatting and test app changes. Pushes to main: also build, push to GHCR and deploy.
# Deployment uses a restricted SSH key: upload Compose, then run the server's deploy command.
# The server checks container health with docker compose up --wait.

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    # Manual runs skip tests. Empty image_tag builds the selected main commit (e.g. after a base-image update).
    # Supply an existing image tag to redeploy it without rebuilding, including for rollback.
    workflow_dispatch:
        inputs:
            image_tag:
                description: "Existing image tag to deploy (leave empty to build from the current commit)"
                required: false
                default: ""

permissions:
    contents: read

jobs:
    format-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - name: Install Air
              uses: posit-dev/setup-air@cf390573ff4fe0f198f35df3a642b1409328d859 # v1.0.1
            - name: Check R code formatting and syntax
              run: air format . --check

    # Docs-only changes skip tests. App code, assets, dependencies and deployment changes trigger them.
    check-r-changes:
        runs-on: ubuntu-latest
        outputs:
            r_changed: ${{ steps.check.outputs.r_changed }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  fetch-depth: 0
            - name: Check for app changes
              id: check
              run: |
                  if [ "${{ github.event_name }}" == "pull_request" ]; then
                    CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
                  else
                    # Include every commit in the push. Manual runs have no before SHA; fall back to HEAD~1.
                    BEFORE="${{ github.event.before }}"
                    if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
                      BEFORE="HEAD~1"
                    fi
                    CHANGED=$(git diff --name-only "$BEFORE" HEAD)
                  fi
                  echo "Changed files:"
                  echo "$CHANGED"
                  if echo "$CHANGED" | grep -qE '\.R$|renv\.lock$|^Dockerfile|^deploy/|^\.Rprofile$|^\.dockerignore$|^packages-.*\.txt$|^(www|data|database|tests|r-utils)/|^r-utils$|^\.github/workflows/'; then
                    echo "r_changed=true" >> $GITHUB_OUTPUT
                  else
                    echo "r_changed=false" >> $GITHUB_OUTPUT
                  fi

    tests:
        runs-on: ubuntu-latest
        needs: check-r-changes
        if: github.event_name != 'workflow_dispatch' && needs.check-r-changes.outputs.r_changed == 'true'
        permissions:
            contents: read
            checks: write
            pull-requests: write
        container:
            image: ghcr.io/ma-riviere/docker-shiny:4.6-test
            options: --user root
        env:
            AUTH0_DISABLE: "true"
            DEV_ROLES: "admin"
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  submodules: recursive
                  token: ${{ secrets.CICD_GITHUB_PAT }}

            - name: Detect test suites
              id: detect-tests
              run: |
                  if [ -d "tests/testthat" ]; then
                    echo "has_shinytest2=true" >> $GITHUB_OUTPUT
                  else
                    echo "has_shinytest2=false" >> $GITHUB_OUTPUT
                  fi
                  if [ -d "tests/e2e" ]; then
                    echo "has_e2e=true" >> $GITHUB_OUTPUT
                  else
                    echo "has_e2e=false" >> $GITHUB_OUTPUT
                  fi

            # Match the dev lockfile; clean = TRUE removes unlisted packages from the base image's library.
            # IN_CONTAINER skips project renv activation, so tests use this site library.
            - name: Install R test packages
              if: steps.detect-tests.outputs.has_shinytest2 == 'true'
              env:
                  GITHUB_PAT: ${{ secrets.CICD_GITHUB_PAT }}
              run: Rscript -e '.libPaths(c("/opt/renv-bootstrap", .libPaths())); renv::restore(lockfile = "renv/profiles/dev-4.6/renv.lock", library = Sys.getenv("R_LIBS_SITE"), clean = TRUE, prompt = FALSE)'

            - name: Run shinytest2 tests
              if: steps.detect-tests.outputs.has_shinytest2 == 'true'
              run: |
                  echo "SHINYTEST2_APP_DRIVER_TEST_ON_CRAN=1" >> .Renviron
                  # Use an absolute path so testthat writes the report at the repo root.
                  R -e 'shinytest2::test_app(reporter = testthat::JunitReporter$new(file = file.path(getwd(), "junit_shinytest2.xml")))'

            # Browser tests run against a local app with Auth0 disabled (job-level env above).
            - name: Install Node.js
              if: steps.detect-tests.outputs.has_e2e == 'true'
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "20"

            - name: Install Playwright dependencies
              if: steps.detect-tests.outputs.has_e2e == 'true'
              working-directory: tests/e2e
              run: |
                  npm ci
                  npx playwright install chromium --with-deps

            - name: Start Shiny app
              if: steps.detect-tests.outputs.has_e2e == 'true'
              run: |
                  R -e "shiny::runApp(port = 9090, launch.browser = FALSE)" &
                  # Poll for an HTTP response for up to 60 seconds before starting browser tests.
                  for i in {1..60}; do
                    if curl -s http://localhost:9090 > /dev/null 2>&1; then
                      echo "App ready on port 9090"
                      break
                    fi
                    echo "Waiting for app... ($i/60)"
                    sleep 1
                  done

            - name: Run Playwright e2e tests
              if: steps.detect-tests.outputs.has_e2e == 'true'
              working-directory: tests/e2e
              env:
                  CI: true
              # Keep the reporters from playwright.config.js; --reporter would override the configured report files.
              run: npx playwright test

            # Publish reports even when a test fails.
            - name: Publish test results
              if: always()
              uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
              with:
                  # Separate check names prevent the two reports from overwriting each other.
                  report_paths: |
                      junit_shinytest2.xml
                      tests/e2e/results.xml
                  check_name: |
                      shinytest2 results
                      Playwright results
                  include_passed: true

    build:
        # Pushes require formatting to pass and tests to pass or be skipped.
        # Manual builds use an empty image_tag; a supplied tag skips the build. Both require main.
        if: |
            !cancelled() &&
            github.ref == 'refs/heads/main' &&
            (
              (github.event_name == 'workflow_dispatch' && inputs.image_tag == '') ||
              (github.event_name == 'push' && needs.format-check.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped'))
            )
        needs: [format-check, tests]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  submodules: recursive
                  token: ${{ secrets.CICD_GITHUB_PAT }}
            - name: Log in to GHCR
              uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Tag the image with this commit's full SHA; deployment uses the same tag below.
            - name: Build and push
              env:
                  GITHUB_PAT: ${{ secrets.CICD_GITHUB_PAT }}
              run: |
                  docker build \
                    --pull \
                    --secret id=github_pat,env=GITHUB_PAT \
                    -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
                  docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

    deploy:
        # Deploy a successful build, or an existing image requested manually. Main only, never PRs.
        if: |
            !cancelled() &&
            github.ref == 'refs/heads/main' &&
            github.event_name != 'pull_request' &&
            (
              needs.build.result == 'success' ||
              (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')
            )
        needs: [build]
        runs-on: ubuntu-latest
        # Serialize production deploys; do not interrupt one already running.
        concurrency:
            group: deploy-shiny-base-prod
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            # Trust the saved server host keys. Do not fetch them with ssh-keyscan during deployment:
            # that would trust whoever answers, without verifying the server's identity.
            - name: Configure SSH
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            # Pin Compose's image tag before upload: manual image_tag if supplied, otherwise this commit's SHA.
            # sed writes to stdout; the Compose file in the checkout stays unchanged.
            # An older image tag still uses this workflow run's Compose file, not the old commit's file.
            - name: Push compose file
              env:
                  INPUT_TAG: ${{ inputs.image_tag }}
              run: |
                  sed "s|\${IMAGE_TAG:-local}|${INPUT_TAG:-${GITHUB_SHA}}|g" deploy/compose.yml \
                    | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p "${{ secrets.DEPLOY_PORT }}" \
                      "deploy@${{ secrets.DEPLOY_HOST }}" push-compose

            - name: Deploy app
              run: |
                  ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p "${{ secrets.DEPLOY_PORT }}" \
                    "deploy@${{ secrets.DEPLOY_HOST }}" deploy
