# Copied into the app image by the Dockerfile. Traefik reaches this server on port 3838.

# Run the app's R process as the same user that owns its mounted folders.
run_as shiny;

server {
    listen 3838;

    location / {
        # Serve the app at /. Logs and bookmarks use persistent folders mounted by Compose.
        site_dir /srv/shiny-server;
        log_dir /var/log/shiny-server;
        bookmark_state_dir /srv/shiny-server/shiny_bookmarks;

        # Show a directory listing when a directory has no app or index page.
        directory_index on;

        # Allow up to 90 seconds for R to initialize the app.
        app_init_timeout 90;

        # Stop R after 10 minutes with no connections. The next visitor waits for a fresh startup.
        app_idle_timeout 600;

        # One R process serves the app; mirai workers are separate.
        # Reject new sessions with HTTP 503 when the 25-request/connection limit is reached.
        simple_scheduler 25;
    }
}
